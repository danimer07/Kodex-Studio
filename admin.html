<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin — Kodex Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
</head>
<body>
<main class="wrap">
  <p class="eyebrow">Panel privado</p>
  <h1 class="page-title">Administración</h1>

  <!-- Login -->
  <form class="card login" id="login">
    <div class="field"><label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password" required></div>
    <div style="margin-top:1.1rem"><button class="pill" type="submit">Entrar</button></div>
    <p class="msg" id="loginMsg" aria-live="polite"></p>
  </form>

  <!-- Panel -->
  <div id="panel" class="hidden">
    <div class="tabs">
      <button class="chip active" data-tab="proyectos" type="button">Proyectos</button>
      <button class="chip" data-tab="mensajes" type="button">Mensajes <span class="count" id="mcount"></span></button>
      <button class="ghost" id="logout" type="button" style="margin-left:auto">Salir</button>
    </div>

    <section id="tab-proyectos">
      <form class="card section" id="pform" novalidate>
        <h3 id="ptitle">Nuevo proyecto</h3>
        <div class="form-grid two" style="margin-top:1rem">
          <div class="field"><label for="p_nombre">Nombre *</label><input id="p_nombre" maxlength="120" required></div>
          <div class="field"><label for="p_cliente">Cliente</label><input id="p_cliente" maxlength="120"></div>
          <div class="field"><label for="p_estado">Estado</label><select id="p_estado"></select></div>
          <div class="field"><label for="p_tech">Tecnologías (separadas por coma)</label><input id="p_tech" placeholder="Node.js, PostgreSQL, React"></div>
          <div class="field"><label for="p_enlace">Enlace del proyecto</label><input id="p_enlace" type="url" placeholder="https://"></div>
          <div class="field"><label for="p_img">URL de imagen</label><input id="p_img" type="url" placeholder="https://"></div>
        </div>
        <div class="field" style="margin-top:1rem"><label for="p_desc">Descripción</label><textarea id="p_desc" maxlength="1000" style="min-height:5.5rem"></textarea></div>
        <label class="check" style="margin-top:1rem"><input type="checkbox" id="p_visible" checked> Visible en la página pública</label>
        <div style="margin-top:1.1rem; display:flex; gap:.6rem; flex-wrap:wrap">
          <button class="pill" type="submit" id="psave">Guardar proyecto</button>
          <button class="ghost" type="button" id="pcancel">Cancelar edición</button>
        </div>
        <p class="msg" id="pmsg" aria-live="polite"></p>
      </form>
      <div class="rows" id="plist"></div>
    </section>

    <section id="tab-mensajes" class="hidden">
      <div class="rows" id="mlist"></div>
    </section>
  </div>
</main>

<script src="/site.js"></script>
<script>
(function () {
  var K = window.K, esc = K.esc, api = K.api;
  var $ = function (id) { return document.getElementById(id); };
  var token = null, projects = [], editingId = null;
  try { token = sessionStorage.getItem('kx_token'); } catch (e) {}

  function auth() { return { headers: { Authorization: 'Bearer ' + token } }; }
  function call(path, opts) {
    return api(path, Object.assign({}, opts, auth())).catch(function (err) {
      if (err.status === 401) logout();
      throw err;
    });
  }
  function setToken(t) { token = t; try { t ? sessionStorage.setItem('kx_token', t) : sessionStorage.removeItem('kx_token'); } catch (e) {} }
  function show(loggedIn) { $('login').classList.toggle('hidden', loggedIn); $('panel').classList.toggle('hidden', !loggedIn); }
  function logout() { setToken(null); show(false); }
  function say(el, text, cls) { el.className = 'msg ' + (cls || ''); el.textContent = text || ''; }
  var fmt = function (d) { return new Date(d).toLocaleString('es-CO', { dateStyle: 'medium', timeStyle: 'short' }); };

  $('p_estado').innerHTML = Object.keys(K.ESTADOS).map(function (e) { return '<option value="' + e + '">' + K.ESTADOS[e] + '</option>'; }).join('');

  /* login */
  $('login').addEventListener('submit', function (e) {
    e.preventDefault();
    say($('loginMsg'), 'Entrando…');
    api('/api/login', { method: 'POST', body: { password: $('pw').value } }).then(function (r) {
      setToken(r.token); $('pw').value = ''; say($('loginMsg'), ''); enter();
    }).catch(function (err) { say($('loginMsg'), err.message, 'err'); });
  });
  $('logout').addEventListener('click', logout);

  /* pestañas */
  document.querySelectorAll('[data-tab]').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('[data-tab]').forEach(function (x) { x.classList.toggle('active', x === b); });
      $('tab-proyectos').classList.toggle('hidden', b.dataset.tab !== 'proyectos');
      $('tab-mensajes').classList.toggle('hidden', b.dataset.tab !== 'mensajes');
    });
  });

  /* proyectos */
  function resetForm() {
    editingId = null; $('pform').reset(); $('p_visible').checked = true; $('p_estado').value = 'desarrollo';
    $('ptitle').textContent = 'Nuevo proyecto'; say($('pmsg'), '');
  }
  $('pcancel').addEventListener('click', resetForm);

  function renderProjects() {
    $('plist').innerHTML = projects.length ? projects.map(function (p) {
      return '<div class="row"><div class="info"><b>' + esc(p.nombre) + '</b> ' +
        '<span class="estado" data-e="' + esc(p.estado) + '">' + esc(K.ESTADOS[p.estado]) + '</span>' +
        (p.visible ? '' : ' <span class="tag">oculto</span>') +
        '<small>' + esc(p.cliente || 'Sin cliente') + '</small></div>' +
        '<div class="acts"><button class="ghost" data-edit="' + p.id + '">Editar</button>' +
        '<button class="ghost danger" data-del="' + p.id + '">Borrar</button></div></div>';
    }).join('') : '<div class="empty">Aún no hay proyectos. Crea el primero arriba.</div>';
  }
  function loadProjects() {
    return call('/api/projects?all=1').then(function (r) { projects = r; renderProjects(); });
  }
  $('plist').addEventListener('click', function (e) {
    var ed = e.target.closest('[data-edit]'), del = e.target.closest('[data-del]');
    if (ed) {
      var p = projects.find(function (x) { return x.id === +ed.dataset.edit; });
      if (!p) return;
      editingId = p.id; $('ptitle').textContent = 'Editando: ' + p.nombre;
      $('p_nombre').value = p.nombre; $('p_cliente').value = p.cliente || ''; $('p_estado').value = p.estado;
      $('p_tech').value = (p.tecnologias || []).join(', '); $('p_enlace').value = p.enlace || '';
      $('p_img').value = p.imagen_url || ''; $('p_desc').value = p.descripcion || ''; $('p_visible').checked = p.visible;
      say($('pmsg'), ''); $('pform').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    if (del && confirm('¿Borrar este proyecto? No se puede deshacer.')) {
      call('/api/projects?id=' + del.dataset.del, { method: 'DELETE' }).then(function () {
        if (editingId === +del.dataset.del) resetForm();
        return loadProjects();
      }).catch(function (err) { say($('pmsg'), err.message, 'err'); });
    }
  });
  $('pform').addEventListener('submit', function (e) {
    e.preventDefault();
    var data = {
      nombre: $('p_nombre').value, cliente: $('p_cliente').value, estado: $('p_estado').value,
      tecnologias: $('p_tech').value, enlace: $('p_enlace').value, imagen_url: $('p_img').value,
      descripcion: $('p_desc').value, visible: $('p_visible').checked
    };
    var url = editingId ? '/api/projects?id=' + editingId : '/api/projects';
    say($('pmsg'), 'Guardando…');
    call(url, { method: editingId ? 'PUT' : 'POST', body: data }).then(function () {
      resetForm(); say($('pmsg'), 'Guardado ✓', 'ok'); return loadProjects();
    }).catch(function (err) { say($('pmsg'), err.message, 'err'); });
  });

  /* mensajes */
  function loadMessages() {
    return call('/api/contact').then(function (rows) {
      $('mcount').textContent = rows.length ? '(' + rows.length + ')' : '';
      $('mlist').innerHTML = rows.length ? rows.map(function (m) {
        return '<div class="row"><div class="info"><b>' + esc(m.nombre || 'Sin nombre') + '</b> · ' +
          '<a href="mailto:' + esc(m.email) + '" style="text-decoration:underline">' + esc(m.email) + '</a>' +
          '<small>' + esc(fmt(m.creado_en)) + ' · ' + esc(m.origen) + '</small>' +
          (m.mensaje ? '<small style="color:var(--heading);margin-top:.5rem;white-space:pre-wrap">' + esc(m.mensaje) + '</small>' : '') +
          '</div><div class="acts"><button class="ghost danger" data-mdel="' + m.id + '">Borrar</button></div></div>';
      }).join('') : '<div class="empty">No hay mensajes todavía.</div>';
    });
  }
  $('mlist').addEventListener('click', function (e) {
    var b = e.target.closest('[data-mdel]');
    if (b && confirm('¿Borrar este mensaje?')) call('/api/contact?id=' + b.dataset.mdel, { method: 'DELETE' }).then(loadMessages);
  });

  function enter() { show(true); Promise.all([loadProjects(), loadMessages()]).catch(function () {}); }
  if (token) enter(); else show(false);
})();
</script>
</body>
</html>
